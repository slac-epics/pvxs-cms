# Unmodified upstream pvxs, no TLS. One image serves both roles.
# Upstream pvxs has no TLS, so it cannot parse the laboratory access security files.
namespace: pvxs-teststand

dockerRegistry: docker.io
dockerUsername: georgeleveln
imageTag: latest
imagePullPolicy: IfNotPresent

images:
  server: pvxs-upstream
  monitor: pvxs-upstream

binaries:
  serverDir: /opt/epics/pvxs/bin
  serverName: softIocPVX
  monitorDir: /opt/epics/pvxs/bin
  monitorName: pvxmonitor
  monitorArgs: ""

# What the test stand's own manifests set on the server. EPICS_PVAS_INTF_ADDR_LIST=0.0.0.0
# stops the PVAccess server in EPICS Base answering searches, so values-pva.yaml drops it.
serverEnv:
  EPICS_PVAS_SERVER_PORT: "5075"
  EPICS_PVAS_INTF_ADDR_LIST: "0.0.0.0"
  EPICS_PVAS_AUTO_BEACON_ADDR_LIST: "NO"
  EPICS_PVAS_BEACON_ADDR_LIST: ""

ports:
  pvaTcp: 5075
  pvaUdp: 5076

pvPrefix: "SIM:"
scanRate: "5 second"
fillRate: ".2 second"
arrayLength: 64

monitorPvs: [counter, mean, sigma, snr, x_axis, noisy_signal, clean_signal]

startMode: supervised

# What the server's probes test: none, supervisor, tcp. See server.yaml.
# The PVA gateway leg. Off unless a permutation needs it; experiment.py turns it on for the
# "gw" search mode. pvagw lives in the four-topologies gateway image.
gateway:
  enabled: false
  image: gateway
  args: ""

probeMode: supervisor

# Seconds between SIGTERM and SIGKILL when the pod is deleted. 0 for an abrupt kill.
terminationGracePeriodSeconds: 30

probes:
  periodSeconds: 10
  failureThreshold: 3
  # The startup probe gets its own budget: 2 s x 30 = 60 s for the server to open its port.
  startupPeriodSeconds: 2
  startupFailureThreshold: 30
  timeoutSeconds: 5

publishNotReadyAddresses: true
replicas: 1
useAccessSecurity: false
