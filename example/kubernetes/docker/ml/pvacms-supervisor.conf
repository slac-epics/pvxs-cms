[program:pvacms]

; ---------------------------------------------------------------------------
; Environment:
;   KRB5_KTNAME / KRB5_CLIENT_KTNAME    Kerberos keytab used by pvacms to
;                                        obtain service credentials for the
;                                        pvacms/cluster@EPICS.ORG principal.
;   EPICS_AUTH_KRB_REALM                Default realm assumed for unqualified
;                                        principals in Kerberos auth flows.
;                                        Assumes network allows access to KDC.
; ---------------------------------------------------------------------------
environment=
    KRB5_KTNAME="/home/idm/.config/krb5/pvacms.keytab",
    KRB5_CLIENT_KTNAME="/home/idm/.config/krb5/pvacms.keytab",
    EPICS_AUTH_KRB_REALM="EPICS.ORG"

; ---------------------------------------------------------------------------
; Command (federated, non-clustered lab):
;   This is the ML department PVACMS. It signs with the pre-minted ML
;   intermediate CA mounted at /etc/pvacms/cert_auth.p12.
;
;   --cert-auth-keychain <file>         The ML intermediate keychain
;                                        (cert + key + facility Root chain).
;   --acf <file>                        ACF controlling admin cert operations.
;
;   Admin bootstrap: with no cluster, the ML department approves its OWN certs,
;   so this PVACMS needs its own admin keychain. If absent, first run
;   `pvacms --admin-keychain-new admin` (generates admin.p12, updates the ACF,
;   exits), then exec the serving pvacms. The admin user is inherited from the
;   idm base image; the ml deployment copies admin.p12 to it (postStart).
;
;   `exec` replaces the shell PID so stopsignal=TERM reaches pvacms directly.
; ---------------------------------------------------------------------------
command=/bin/sh -c '
    PVACMS=/opt/epics/pvxs-cms/bin/$(/opt/epics/epics-base/startup/EpicsHostArch)/pvacms;
    ADMIN=/home/idm/.config/pva/1.5/admin.p12;
    set -e;
    if [ ! -s "$ADMIN" ]; then
        # Sign the admin keychain with the intermediate CA (requires pvxs-cms #50,
        # which lets --admin-keychain-new accept -c/--cert-auth-keychain).
        "$PVACMS" --cert-auth-keychain /etc/pvacms/cert_auth.p12 --admin-keychain "$ADMIN" --acf /etc/pvacms/pvacms.acf --admin-keychain-new admin;
    fi;
    exec "$PVACMS" --cert-auth-keychain /etc/pvacms/cert_auth.p12 --acf /etc/pvacms/pvacms.acf --admin-keychain "$ADMIN" -v'

user=idm
autostart=true
autorestart=true

; Send logs to container stdout/stderr
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
