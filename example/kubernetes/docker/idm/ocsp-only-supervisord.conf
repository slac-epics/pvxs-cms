; Supervisor for the container that answers for the facility root.
;
; The include names one file rather than the directory: this container runs the same image as
; the certificate managers, whose configuration would also start a certificate manager, a
; Kerberos server and a display here.

[supervisord]
nodaemon=true
logfile=/proc/1/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/ocsp.conf
