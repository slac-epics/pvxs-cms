; Supervisor, for a container that answers for the facility root and does nothing else.
;
; The image this container runs is the one the certificate managers run, because it already has
; openssl and the certificate tools. Its own supervisor configuration starts everything that
; image can offer - a certificate manager, a Kerberos server, a display - and on a network where
; the real ones are already running, a second certificate manager answering for the same
; department is not a harmless extra process.
;
; So the include names one file rather than a directory. Adding a program to the image does not
; silently add it here.

[supervisord]
nodaemon=true
logfile=/proc/1/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/ocsp.conf
