; The responder that answers for the facility root, and the check that keeps it answering.
;
; The root has no status channel of its own - an answer about the trust anchor carried over a
; connection that anchor underwrites would be worth nothing - so it names this responder
; instead, and each department's certificate manager asks it whether the root still stands.

[program:ocsp]

; ---------------------------------------------------------------------------
; Command:
;   openssl's own responder, reading what to say from a certificate index.
;
;   -index    what it says about each certificate: V for stands, R for revoked
;   -CA       the root, to verify a request names the certificate it answers for
;   -rsigner  a certificate the root authorised for this purpose, so the root's
;              own key is not on the responder
;   -nmin 1   how long each answer is good for, which is also how often a
;              certificate manager will ask again
; ---------------------------------------------------------------------------
command=/usr/bin/openssl ocsp
    -index /ocsp/index.txt
    -CA /ocsp/ca.pem
    -rsigner /ocsp/signer.pem
    -rkey /ocsp/signer.key
    -port 8888
    -nmin 1
autostart=true
autorestart=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true

[program:ocsp-watchdog]

; ---------------------------------------------------------------------------
; Why this exists:
;   openssl's responder serves one caller at a time and can reach a state where
;   it accepts connections and answers none of them. Nothing about that looks
;   wrong from outside: the process is alive, the port is open, and supervisor
;   sees a program that has not exited, so it has no reason to act.
;
;   What that does to a laboratory is out of all proportion to the cause.
;   Neither certificate manager can establish the authority, every certificate
;   beneath it is reported unusable, and administration stops with them - so
;   the tools that would show you why have stopped too.
;
;   A caller that gets no answer is the definition of the fault, so that is the
;   test. Restarting is left to supervisor, which knows how to stop a program
;   that will not stop politely.
; ---------------------------------------------------------------------------
command=/bin/sh -c '
    while :; do
        sleep 10;
        if ! timeout 8 openssl ocsp -issuer /ocsp/ca.pem -cert /ocsp/ca.pem
                                    -url http://127.0.0.1:8888 -CAfile /ocsp/ca.pem
             >/dev/null 2>&1; then
            echo "ocsp-watchdog: no answer, restarting the responder";
            supervisorctl restart ocsp;
        fi;
    done'
autostart=true
autorestart=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
