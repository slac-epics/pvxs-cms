dockerRegistry: "ghcr.io"
dockerUsername: "slac-epics"

images:
  idm:
    name: "idm"
    tag: "latest"
  internet:
    name: "internet"
    tag: "latest"
  testioc:
    name: "testioc"
    tag: "latest"
  tstioc:
    name: "tstioc"
    tag: "latest"
  ml:
    name: "ml"
    tag: "latest"
  mlIoc:
    name: "ml-ioc"
    tag: "latest"
  gateway:
    name: "gateway"
    tag: "latest"
  lab:
    name: "lab"
    tag: "latest"
  csStudio:
    name: "cs-studio"
    tag: "latest"

imagePullPolicy: IfNotPresent

idm:
  replicas: 1
  service:
    name: "idm"
    udpPort: 88
    tcpPort: 749
    pwdPort: 464

  expose:
    nodePortUdp: 30088
    nodePortTcp: 30049

  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    dataSize: 256Mi
    storageClassName: ""

internet:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

ml:
  replicas: 1
  debug:
    enabled: true
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    dataSize: 256Mi
    storageClassName: ""

mlIoc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

mlGateway:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

  config: |
    {
      "version": 2,
      "readOnly": false,
      "clients": [
        {
          "name": "ml-local",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.mlService" . }} {{ include "pvxs-lab.mlIocService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
        }
      ],
      "servers": [
        {
          "name": "gateway",
          "clients": ["ml-local"],
          "acf_client": "ml-local",
          "statusprefix": "GW:STS:",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.mlService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
          "serverport": "5075",
          "EPICS_PVAS_TLS_PORT": "5076",
          "bcastport": "5076",
          "access": "gateway.acf",
          "pvlist": "gateway.pvlist"
        },
        {
          "name": "downstream_status",
          "clients": [],
          "interface": ["127.0.0.1"],
          "serverport": "0",
          "statusprefix": "GW:STS:"
        }
      ]
    }

  # ML gateway forwards ML PVs, and - keyed by the ML department issuer id - the ML
  # cert CREATE/STATUS PVs to the ML PVACMS. Naming the issuer (rather than a wildcard)
  # means only the requests this gateway can actually serve are claimed, so a client
  # reaching both gateways from the Internet routes straight to the right one.
  # __ML_ISSUER__ is substituted at pod start from the issuer-ids ConfigMap.
  gatewayPvlist: |
    ml:.* ALLOW
    CERT:CREATE:__ML_ISSUER__(?::.*)? ALLOW CERT_CREATE
    CERT:STATUS:__ML_ISSUER__(?::.*)? ALLOW CERT_STATUS

testioc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

tstioc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

gateway:
  replicas: 1
  hostNetwork: false    # for NodePort mode
  # externalInterface: 123.45.6.7   # egress if defined
  separate_server_keychain: false

  expose: {}

  config: |
    {
      "version": 2,
      "readOnly": false,
      "clients": [
        {
          "name": "local",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.pvacmsService" . }} {{ include "pvxs-lab.testiocService" . }} {{ include "pvxs-lab.tstiocService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
        }
      ],
      "servers": [
        {
          "name": "gateway",
          "clients": ["local"],
          "acf_client": "local",
          "statusprefix": "GW:STS:",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.pvacmsService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway{{ if .Values.gateway.separate_server_keychain }}{{ "S" }}{{ end }}.p12",
          "serverport": "5075",
          "EPICS_PVAS_TLS_PORT": "5076",
          "bcastport": "5076",
          "access": "gateway.acf",
          "pvlist": "gateway.pvlist"
        },
        {
          "name": "downstream_status",
          "clients": [],
          "interface": ["127.0.0.1"],
          "serverport": "0",
          "statusprefix": "GW:STS:"
        }
      ]
    }

  # The lab gateway serves NON-lab clients (ML + Internet) that want lab PVs. One
  # server, one gateway.pvlist: the lab IOC PVs plus - keyed by the Controls (Lab)
  # department issuer id - the Lab cert CREATE/STATUS PVs to the Lab (idm) PVACMS.
  # __LAB_ISSUER__ is substituted at pod start from the issuer-ids ConfigMap.
  gatewayPvlist: |
    test:.* ALLOW
    tst:.* ALLOW
    test:spec ALLOW SPECIAL
    CERT:CREATE:__LAB_ISSUER__(?::.*)? ALLOW CERT_CREATE
    CERT:STATUS:__LAB_ISSUER__(?::.*)? ALLOW CERT_STATUS

  debug:
    enabled: false
    logLevel: "p4p.gw=DEBUG,pvxs.*=DEBUG"

  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioLab:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioMl:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioInternet:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

lab:
  image: "lab:latest"
  replicas: 1

  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

  keepalive:
    enabled: true
    command: ["/bin/sh", "-lc"]
    args: ["sleep infinity"]

# Common names of the certificate authorities the laboratory mints.
#
# These are the single source: the certificate generation job mints with them and
# each department's access security file names its own intermediate with them, so
# changing one here changes both. Change one without the other and the certificate
# manager will refuse every administrator, because the authority the rule names
# will no longer be the authority that issued the administrator's certificate.
certAuthorities:
  root: "EPICS Root Certificate Authority"
  labIntermediate: "EPICS Controls Intermediate CA"
  mlIntermediate: "EPICS ML Intermediate CA"

# Internal PVAccess ports (PVXS/P4P defaults)
ports:
  pvaTcp: 5075
  pvaUdp: 5076
  pvaTls: 5076
  exposePvaTls: true

