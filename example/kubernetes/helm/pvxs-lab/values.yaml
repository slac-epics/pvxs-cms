dockerRegistry: "ghcr.io"
dockerUsername: "slac-epics"

images:
  idm:
    name: "idm"
    tag: "latest"
  internet:
    name: "internet"
    tag: "latest"
  testioc:
    name: "testioc"
    tag: "latest"
  tstioc:
    name: "tstioc"
    tag: "latest"
  ml:
    name: "ml"
    tag: "latest"
  mlIoc:
    name: "ml-ioc"
    tag: "latest"
  gateway:
    name: "gateway"
    tag: "latest"
  lab:
    name: "lab"
    tag: "latest"
  csStudio:
    name: "cs-studio"
    tag: "latest"

imagePullPolicy: IfNotPresent

idm:
  replicas: 1
  service:
    name: "idm"
    udpPort: 88
    tcpPort: 749
    pwdPort: 464

  expose:
    nodePortUdp: 30088
    nodePortTcp: 30049

  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    dataSize: 256Mi
    storageClassName: ""

internet:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

ml:
  replicas: 1
  debug:
    enabled: true
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    dataSize: 256Mi
    storageClassName: ""

mlIoc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

mlGateway:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

  config: |
    {
      "version": 2,
      "readOnly": false,
      "clients": [
        {
          "name": "ml-local",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.mlService" . }} {{ include "pvxs-lab.mlIocService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
        }
      ],
      "servers": [
        {
          "name": "gateway",
          "clients": ["ml-local"],
          "acf_client": "ml-local",
          "statusprefix": "GW:STS:",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.mlService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
          "serverport": "5075",
          "EPICS_PVAS_TLS_PORT": "5076",
          "bcastport": "5076",
          "access": "gateway.acf",
          "pvlist": "gateway.pvlist"
        },
        {
          "name": "downstream_status",
          "clients": [],
          "interface": ["127.0.0.1"],
          "serverport": "0",
          "statusprefix": "GW:STS:"
        }
      ]
    }

  # ML gateway forwards ML PVs, and - keyed by the ML department issuer id - the ML
  # cert CREATE/STATUS PVs to the ML PVACMS. Naming the issuer (rather than a wildcard)
  # means only the requests this gateway can actually serve are claimed, so a client
  # reaching both gateways from the Internet routes straight to the right one.
  # __ML_ISSUER__ is substituted at pod start from the issuer-ids ConfigMap.
  gatewayPvlist: |
    ml:.* ALLOW
    CERT:CREATE:__ML_ISSUER__(?::.*)? ALLOW CERT_CREATE
    CERT:STATUS:__ML_ISSUER__(?::.*)? ALLOW CERT_STATUS
    # The two certificate listing views that are open to everyone, named by issuer so this
    # gateway claims only what its own certificate manager can answer. The plain names are
    # deliberately absent: both certificate managers answer those and neither gateway could
    # say which department a request meant. The view of certificates awaiting a decision is
    # deliberately absent too - a gateway makes its upstream connection as itself, so the
    # certificate manager's read gate would see the gateway rather than the administrator.
    CERT:LIST:__ML_ISSUER__:ALL ALLOW CERT_STATUS
    CERT:LIST:__ML_ISSUER__:EXPIRING ALLOW CERT_STATUS

testioc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

tstioc:
  replicas: 1
  debug:
    enabled: false
    logLevel: "pvxs.*=INFO"
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

gateway:
  replicas: 1
  hostNetwork: false    # for NodePort mode
  # externalInterface: 123.45.6.7   # egress if defined
  separate_server_keychain: false

  expose: {}

  config: |
    {
      "version": 2,
      "readOnly": false,
      "clients": [
        {
          "name": "local",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.pvacmsService" . }} {{ include "pvxs-lab.testiocService" . }} {{ include "pvxs-lab.tstiocService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
        }
      ],
      "servers": [
        {
          "name": "gateway",
          "clients": ["local"],
          "acf_client": "local",
          "statusprefix": "GW:STS:",
          "autoaddrlist": false,
          "addrlist": "{{ include "pvxs-lab.pvacmsService" . }}",
          "tls_keychain": "/home/gateway/.config/pva/1.5/gateway{{ if .Values.gateway.separate_server_keychain }}{{ "S" }}{{ end }}.p12",
          "serverport": "5075",
          "EPICS_PVAS_TLS_PORT": "5076",
          "bcastport": "5076",
          "access": "gateway.acf",
          "pvlist": "gateway.pvlist"
        },
        {
          "name": "downstream_status",
          "clients": [],
          "interface": ["127.0.0.1"],
          "serverport": "0",
          "statusprefix": "GW:STS:"
        }
      ]
    }

  # The lab gateway serves NON-lab clients (ML + Internet) that want lab PVs. One
  # server, one gateway.pvlist: the lab IOC PVs plus - keyed by the Controls (Lab)
  # department issuer id - the Lab cert CREATE/STATUS PVs to the Lab (idm) PVACMS.
  # __LAB_ISSUER__ is substituted at pod start from the issuer-ids ConfigMap.
  gatewayPvlist: |
    test:.* ALLOW
    tst:.* ALLOW
    test:spec ALLOW SPECIAL
    CERT:CREATE:__LAB_ISSUER__(?::.*)? ALLOW CERT_CREATE
    CERT:STATUS:__LAB_ISSUER__(?::.*)? ALLOW CERT_STATUS
    # The two views that are open to everyone, named by issuer. See the machine learning
    # gateway's list for why the plain names and the awaiting-decision view are absent.
    CERT:LIST:__LAB_ISSUER__:ALL ALLOW CERT_STATUS
    CERT:LIST:__LAB_ISSUER__:EXPIRING ALLOW CERT_STATUS

  debug:
    enabled: false
    logLevel: "p4p.gw=DEBUG,pvxs.*=DEBUG"

  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioLab:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

# The three certificate administration desktops, one per zone. Separate from the control room
# displays: the network policy differs, the noVNC forward is a different port so both can be open
# at once, and tearing an administrator desktop down does not take the control room with it.
certAdminLab:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

certAdminMl:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

certAdminInternet:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioMl:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

csStudioInternet:
  replicas: 1
  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

lab:
  image: "lab:latest"
  replicas: 1

  persistence:
    enabled: true
    size: 64Mi
    storageClassName: ""

  keepalive:
    enabled: true
    command: ["/bin/sh", "-lc"]
    args: ["sleep infinity"]

# Common names of the certificate authorities the laboratory mints.
#
# These are the single source: the certificate generation job mints with them and
# each department's access security file names its own intermediate with them, so
# changing one here changes both. Change one without the other and the certificate
# manager will refuse every administrator, because the authority the rule names
# will no longer be the authority that issued the administrator's certificate.
certAuthorities:
  root: "EPICS Root Certificate Authority"
  labIntermediate: "EPICS Controls Intermediate CA"
  mlIntermediate: "EPICS ML Intermediate CA"

# Internal PVAccess ports (PVXS/P4P defaults)
ports:
  pvaTcp: 5075
  pvaUdp: 5076
  pvaTls: 5076
  exposePvaTls: true

# Health probes for the two certificate managers. supervisord keeps the container
# up whatever happens to the programs under it, so without these a dead
# certificate manager still reports the pod Running and Ready. The check is a TCP
# connect to pvaTcp above. Set enabled to false while debugging a wedged
# certificate manager you want left exactly as it is.
pvacmsProbes:
  enabled: true
  # Up to two minutes to start: a first start mints an administrator keychain.
  startup:
    periodSeconds: 5
    failureThreshold: 24
  # Out of the Service within about twenty seconds of it going quiet.
  readiness:
    periodSeconds: 10
    failureThreshold: 2
  # Slow on purpose: supervisord restarts the program itself, and a container
  # restart takes the rest of the pod down with it. About ninety seconds.
  liveness:
    periodSeconds: 15
    failureThreshold: 6

