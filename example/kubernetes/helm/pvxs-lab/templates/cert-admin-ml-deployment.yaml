apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pvxs-lab.certAdminMlService" . }}
  labels:
    {{- include "pvxs-lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.certAdminMl.replicas }}
  selector:
    matchLabels:
      app: cert-admin-ml
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: cert-admin-ml
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: cert-admin-ml
          image: {{ include "pvxs-lab.image" (dict "Values" .Values "name" .Values.images.csStudio.name "tag" .Values.images.csStudio.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - exec /usr/bin/supervisord -c /etc/supervisor/supervisord.conf
          volumeMounts:
            {{- include "pvxs-lab.issuersMount" (dict "ctx" .) | nindent 12 }}
            - name: pva-config
              mountPath: /home/mlcertadmin/.config/pva/1.5
              subPath: mlcertadmin
            - name: krb5-conf
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
          env:
          {{- /* Both ids, and no pod-level EPICS_PVA_AUTH_ISSUER: the user's profile selects. */}}
          {{- include "pvxs-lab.issuersEnv" (dict "ctx" .) | nindent 12 }}
            - name: EPICS_AUTH_KRB_REALM
              value: "EPICS.ORG"
          ports:
            - name: novnc
              containerPort: 8080
      volumes:
        {{- include "pvxs-lab.issuersVolume" (dict "ctx" .) | nindent 8 }}
        - name: pva-config
          {{- if .Values.certAdminMl.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pvxs-lab.fullname" . }}-cert-admin-ml-pva
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: krb5-conf
          configMap:
            name: {{ include "pvxs-lab.fullname" . }}-krb5
