# NETWORK ZONE ISOLATION. Strategy: ingress access control only
#
# Federated, non-clustered lab. Each gateway forwards to its own co-zone PVACMS
# (for the department's CERT:CREATE/STATUS PVs); there is no cross-zone PVACMS
# cluster sync, so no xgw (5175) ingress rules.
#
# 1-a) Lab (idm) PVACMS & KDC ingress:
#          Allow EVERYTHING from lab-zone peers + the lab gateway (the lab gateway
#          forwards CERT:* to this PVACMS).
#          Allow KDC (88/UDP, 749/TCP) from internet and ml zones.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-lab-pvacms-kdc-ingress
spec:
  podSelector:
    matchLabels:
      app: idm
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    # Rule 1: full access from lab-zone peers + the lab gateway
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["lab", "cs-studio-lab", "cert-admin-lab", "gateway", "testioc", "tstioc"]
            matchLabels:
              release: {{ .Release.Name }}

    # Rule 2: KDC from ml and internet zones
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ml", "cs-studio-ml", "cert-admin-ml", "internet", "cs-studio-internet", "cert-admin-internet"]
            matchLabels:
              release: {{ .Release.Name }}
      ports:
        - protocol: UDP
          port: 88
        - protocol: TCP
          port: 749

---
# 1-b) ML PVACMS ingress:
#          Allow EVERYTHING from ml-zone peers + the ml-gateway (the ml-gateway
#          forwards CERT:* to this PVACMS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-ml-pvacms-ingress
spec:
  podSelector:
    matchLabels:
      app: ml
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    # Rule 1: full access from ml-zone peers + ml-gateway
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ml", "cs-studio-ml", "cert-admin-ml", "ml-gateway", "ml-ioc"]
            matchLabels:
              release: {{ .Release.Name }}

---
# 2-a) Lab IOC ingress: allow ONLY from lab, and the lab gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-lab-ioc-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["testioc", "tstioc"]
    matchLabels:
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["lab", "cs-studio-lab", "gateway"]
            matchLabels:
              release: {{ .Release.Name }}

---
# 2-b) ML IOC ingress: allow ONLY from ml, cs-studio-ml, and ml-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-ml-ioc-ingress
spec:
  podSelector:
    matchLabels:
      app: ml-ioc
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ml", "cs-studio-ml", "ml-gateway"]
            matchLabels:
              release: {{ .Release.Name }}

---
# 3-a) Lab Gateway ingress: allow from all non-lab pods, including the ML gateway
#      (ML and Internet clients reach lab IOCs / the Lab CERT:* PVs via this gateway)
#
#      The ML gateway is allowed in for one reason only: when a client holding a
#      Lab-issued certificate connects to it, it has to check that certificate's
#      status, and only the Lab PVACMS can answer. It asks through this gateway
#      rather than reaching the Lab PVACMS directly, which stays blocked. This
#      gateway's pvlist forwards CERT:STATUS for the Lab issuer and nothing else,
#      so the ML gateway cannot use the opening to reach lab IOCs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-lab-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: gateway
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: NotIn
                values: ["lab", "cs-studio-lab", "cert-admin-lab", "idm", "gateway", "testioc", "tstioc"]
            matchLabels:
              release: {{ .Release.Name }}

---
# 3-b) ML Gateway ingress: allow from all non-ML pods, including the Lab gateway
#      (Lab and Internet clients reach ml IOCs / the ML CERT:* PVs via this gateway)
#
#      The Lab gateway is allowed in for the mirror-image reason: to check the
#      status of an ML-issued certificate presented to it, asking through this
#      gateway rather than reaching the ML PVACMS directly. This gateway's pvlist
#      forwards CERT:STATUS for the ML issuer and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvxs-lab.fullname" . }}-ml-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: ml-gateway
      release: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: NotIn
                values: ["ml", "cs-studio-ml", "cert-admin-ml", "ml-gateway", "ml-ioc"]
            matchLabels:
              release: {{ .Release.Name }}
