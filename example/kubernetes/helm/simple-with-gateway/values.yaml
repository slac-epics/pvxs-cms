# The simple-with-gateway laboratory.
#
#   Discovery. A pod network has no broadcast domain, so the zone is given an explicit address
#   list of the IOC services, and reaches its own IOCs by naming them.
#
#   The gateway. A NetworkPolicy stops the zone reaching the gateway's ports, so a
#   misconfiguration here times out.

namespace: spva-lab

dockerRegistry: localhost
dockerUsername: spva
imageTag: latest
imagePullPolicy: IfNotPresent

images:
  idm: idm
  testioc: testioc
  tstioc: tstioc
  lab: lab
  gateway: gateway
  internet: internet

# Same numbers on both sides of every service, always. A PVAccess server names its own port in
# a search reply and the client then dials that port, so a service that translated one would
# send the client somewhere nothing is listening.
ports:
  pvaTcp: 5075
  pvaTls: 5076
  pvaUdp: 5076

certAuthority:
  name: EPICS Root Certificate Authority
  organization: certs.epics.org
  organizationalUnit: epics.org Certificate Authority

# The address the workstation outside the boundary knows, a Service named 'facility'. Set type
# to LoadBalancer to publish it outside the cluster.
facility:
  serviceType: ClusterIP

persistence:
  storageClass: ""
  size: 128Mi
