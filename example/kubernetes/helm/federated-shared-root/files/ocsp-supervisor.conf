[program:ocsp]

; ---------------------------------------------------------------------------
; Command:
;   The responder that answers for the facility root.
;
;   -index    what it says about each certificate: V stands, R revoked
;   -CA       the root, which the request names a certificate of
;   -rsigner  a certificate the root authorised to sign answers, so the root's
;              own key is not on the responder
;   -rkey     its key
;   -port     where the address in the root's extension points
;   -nmin     how long an answer is good for, in minutes
;   -multi    how many responder processes answer at once. Without it there is
;              one, which takes callers strictly in turn: a facility with two
;              certificate managers and this file's own watchdog has three
;              askers, and the ones left waiting conclude the responder cannot
;              be reached - which stops every connection those managers
;              underwrite. A responder is not the place to serialise a facility.
;   -timeout  how long a responder waits on a caller that has connected and not
;              asked. Without it such a caller holds a responder process for as
;              long as it likes, which is the same outage by another route.
; ---------------------------------------------------------------------------
command=/usr/bin/openssl ocsp
    -index /ocsp/index.txt
    -CA /ocsp/ca.pem
    -rsigner /ocsp/signer.pem
    -rkey /ocsp/signer.key
    -port 8888
    -nmin 1
    -multi 4
    -timeout 5
autostart=true
autorestart=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true

[program:ocsp-watchdog]

; ---------------------------------------------------------------------------
; Command:
;   Asks the responder for the root's status every ten seconds, and has
;   supervisor restart it after two failures in a row. The responder can hold
;   the port open while answering nothing, which is not an exit and so not
;   something supervisor acts on by itself.
; ---------------------------------------------------------------------------
; Each continued line is a whole statement: supervisor joins them, and a command split
; across two of them is read as two commands.
command=/bin/sh -c '
    misses=0;
    while :; do
        sleep 10;
        if timeout 8 openssl ocsp -issuer /ocsp/ca.pem -cert /ocsp/ca.pem -url http://127.0.0.1:8888 -CAfile /ocsp/ca.pem >/dev/null 2>&1; then misses=0;
        else
            misses=$((misses + 1));
            if [ $misses -ge 2 ]; then echo "ocsp-watchdog: no answer, restarting"; supervisorctl restart ocsp; misses=0; fi;
        fi;
    done'
autostart=true
autorestart=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
