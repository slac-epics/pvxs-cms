# The facility load balancer: layer 4, and nothing above it.
#
# One address for the facility, and the port chooses the department. Each frontend and its
# backend use the same port number, on purpose: a server names its own port in a search reply
# and the client then dials that port on the address the reply came from, so translating one
# would send a client to the other department.
#
# THE DIFFERENCE: the podman file pins every backend to the perimeter subnet, because a
# gateway there stands on two segments and the name resolves to both. A pod holds one address
# and a Service selects it, so there is nothing to disambiguate and the clause is gone.

resolvers podman
    parse-resolv-conf
    resolve_retries     3
    timeout resolve     1s
    timeout retry       1s
    hold valid          5s
    hold other          5s
    hold refused        5s
    hold nx             5s
    hold timeout        5s

defaults
    mode                tcp
    log                 global
    option              tcplog
    timeout connect     5s
    # A monitor stays open and says nothing for long stretches, so these are hours.
    timeout client      24h
    timeout server      24h

global
    log stdout format raw local0

frontend lab_plain
    bind :5075
    default_backend lab_gw_plain
backend lab_gw_plain
    server lab-gateway pvxs-lab-gateway:5075

frontend lab_tls
    bind :5076
    default_backend lab_gw_tls
backend lab_gw_tls
    server lab-gateway pvxs-lab-gateway:5076

frontend ml_plain
    bind :5175
    default_backend ml_gw_plain
backend ml_gw_plain
    server ml-gateway pvxs-lab-ml-gateway:5175

frontend ml_tls
    bind :5176
    default_backend ml_gw_tls
backend ml_gw_tls
    server ml-gateway pvxs-lab-ml-gateway:5176
