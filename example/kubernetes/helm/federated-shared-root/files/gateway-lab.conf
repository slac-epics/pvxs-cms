      "statusprefix": "GW:STS:",
      "//interface": "THE DIFFERENCE: podman pins this to the perimeter address so the gateway never answers its own department. A pod has one address, so it binds all of them and a NetworkPolicy stops the department reaching it instead.",
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-pvacms",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
      "serverport": "5075",
      "//peer": "Its server side has to ask the ML department whether a certificate it is",
      "//peer2": "presented still stands, and only that department can answer. The peer",
      "//peer3": "gateway is named, never the peer certificate manager: the two gateways",
      "//peer4": "share the perimeter segment, and this is the only thing that crosses it.",
      "//peer5": "Read by the inner client alone, so nothing else here is given the route.",
      "EPICS_PVAS_STATUS_NAME_SERVERS": "pvxs-lab-ml-gateway:5175",
      "EPICS_PVAS_TLS_PORT": "5076",
      "bcastport": "5076",
      "access": "gateway.acf",
      "pvlist": "gateway.pvlist"
    },
    {
      "name": "downstream_status",
      "clients": [],
      "interface": ["127.0.0.1"],
      "serverport": "0",
      "statusprefix": "GW:STS:"
    }
