{{/*
The authorities, minted before anything starts.

THE DIFFERENCE from simple-with-gateway: there the certificate manager mints its own authority
the first time it runs, and the issuer id is read back afterwards. Here there are two managers
under one root, so the hierarchy has to exist before either of them starts and both have to be
handed a piece of it. podman does this with mint.sh on the host, writing into a bind mount;
there is no host to write to here, so the same binary runs as a pre-install hook and the result
is packaged into Secrets.

The root is written without its key. It is a trust anchor for every host, and the key that
would let anything be signed with it is not wanted on a running service.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-keygen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ca-keygen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-keygen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ca-keygen}
subjects:
  - kind: ServiceAccount
    name: ca-keygen
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ca-keygen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Kept when it fails, so the reason is readable. A job deleted on failure takes
    # its logs with it and reports only that the release did not install.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app: ca-keygen}
    spec:
      serviceAccountName: ca-keygen
      restartPolicy: OnFailure
      initContainers:
        # Whether authorities already exist, asked of the cluster before anything is minted.
        # A separate container because the minting image has no kubectl.
        - name: probe
          image: {{ include "lab.image" (dict "Values" .Values "role" "kubectl") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if kubectl get configmap lab-issuer-ids >/dev/null 2>&1; then
                  echo yes > /certs/.skip
              else
                  echo no > /certs/.skip
              fi
          volumeMounts:
            - {name: certs, mountPath: /certs}
        - name: mint
          image: {{ include "lab.image" (dict "Values" .Values "role" "idm") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
                # Minted once per laboratory, not once per helm operation. The reset deletes
                # the marker, so a new laboratory gets new authorities.
              if [ "$(cat /certs/.skip 2>/dev/null)" = yes ]; then
                  echo "authorities already exist, keeping them"; exit 0
              fi
              # -S names the responder INSIDE the root's certificate. The root has no status
              # process variable of its own, so that responder is the only way its revocation
              # ever reaches the certificates issued beneath it. Changing the name means
              # minting again.
              /opt/epics/pvxs-cms/test/O.$(/opt/epics/epics-base/startup/EpicsHostArch)/gen_lab_certs \
                  -O /certs \
                  -R {{ .Values.certAuthorities.root | quote }} \
                  -L {{ .Values.certAuthorities.labIntermediate | quote }} \
                  -M {{ .Values.certAuthorities.mlIntermediate | quote }} \
                  -S "http://{{ .Values.responder.serviceName }}:{{ .Values.ports.ocsp }}"
              cat /certs/issuer_ids.env
          volumeMounts:
            - {name: certs, mountPath: /certs}
      containers:
        - name: package
          image: {{ include "lab.image" (dict "Values" .Values "role" "kubectl") }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cd /certs
              if [ "$(cat .skip 2>/dev/null)" = yes ]; then
                  echo "authorities already exist, keeping them"; exit 0
              fi
              # Each department gets only its own authority. The facility root's key is never
              # packaged at all: gen_lab_certs writes the root without one.
              kubectl create secret generic lab-intermediate \
                  --from-file=cert_auth.p12=lab_intermediate.p12 \
                  --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic ml-intermediate \
                  --from-file=cert_auth.p12=ml_intermediate.p12 \
                  --dry-run=client -o yaml | kubectl apply -f -
              # What the responder needs to answer for the root, and nothing else. The root's
              # own key is not among these: the responder signs with a certificate of its own
              # that the root issued for the purpose.
              kubectl create secret generic ocsp-material \
                  --from-file=ca.pem=ocsp_ca.pem \
                  --from-file=signer.pem=ocsp_signer.pem \
                  --from-file=signer.key=ocsp_signer.key \
                  --dry-run=client -o yaml | kubectl apply -f -
              # The line saying whether the root still stands. Kept apart from the material
              # above because it is rewritten during a demonstration while none of that is.
              kubectl create configmap ocsp-index-seed \
                  --from-file=index.txt=ocsp_index.txt \
                  --dry-run=client -o yaml | kubectl apply -f -
              . ./issuer_ids.env
              kubectl create configmap lab-issuer-ids \
                  --from-literal=LAB_ISSUER="$LAB_ISSUER" \
                  --from-literal=ML_ISSUER="$ML_ISSUER" \
                  --from-literal=LAB_ISSUER_SKID="$LAB_ISSUER_SKID" \
                  --from-literal=ML_ISSUER_SKID="$ML_ISSUER_SKID" \
                  --dry-run=client -o yaml | kubectl apply -f -
              echo "authorities minted: LAB=$LAB_ISSUER ML=$ML_ISSUER"
          volumeMounts:
            - {name: certs, mountPath: /certs}
      volumes:
        - {name: certs, emptyDir: {}}
