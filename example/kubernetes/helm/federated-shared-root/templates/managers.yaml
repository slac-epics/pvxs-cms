{{/*
The two certificate managers. Each holds only its own department's intermediate, and neither
can be addressed from outside its department: one interface each, which is the whole point of
the arrangement.
*/}}
{{- $depts := list (dict "n" "lab" "app" "pvacms" "deploy" "pvxs-lab-pvacms" "role" "idm" "cfg" "idm-config" "data" "idm-data" "secret" "lab-intermediate" "acf" "pvacms-lab.acf" "arg" "lab" "tcp" .Values.ports.pvaTcp "tls" .Values.ports.pvaTls) (dict "n" "ml" "app" "ml" "deploy" "pvxs-lab-ml-pvacms" "role" "ml" "cfg" "ml-config" "data" "ml-data" "secret" "ml-intermediate" "acf" "pvacms-ml.acf" "arg" "ml" "tcp" .Values.ports.pvaTcp "tls" .Values.ports.pvaTls) }}
{{- range $d := $depts }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $d.deploy }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $d.app }}}}
  template:
    metadata:
      labels: {app: {{ $d.app }}, zone: {{ $d.n }}}
    spec:
      securityContext: {runAsUser: 0, fsGroup: 0}
      containers:
        - name: pvacms
          image: {{ include "lab.image" (dict "Values" $.Values "role" $d.role) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: ["/usr/local/bin/start-pvacms", "{{ $d.arg }}"]
          env:
{{- if eq $d.n "lab" }}
{{ include "lab.labZoneEnv" $ | indent 12 }}
{{- else }}
{{ include "lab.mlZoneEnv" $ | indent 12 }}
{{- end }}
{{ include "lab.issuerEnv" $ | indent 12 }}
            - name: EPICS_PVACMS_DB
              value: /home/idm/.local/share/pva/1.5/certs.db
            - name: EPICS_PVA_TLS_KEYCHAIN
              value: /home/idm/.config/pva/1.5/server.p12
          ports:
            - {containerPort: {{ $d.tcp }}, protocol: TCP}
            - {containerPort: {{ $d.tls }}, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /home/idm/.config/pva/1.5}
            - {name: data, mountPath: /home/idm/.local/share/pva/1.5}
            - {name: authority, mountPath: /certs/{{ $d.arg }}_intermediate.p12, subPath: cert_auth.p12}
            - {name: acf, mountPath: /etc/pvacms/pvacms.acf, subPath: {{ $d.acf }}}
{{ include "lab.scriptsMount" $ | indent 12 }}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: {{ $d.cfg }}}}
        - {name: data, persistentVolumeClaim: {claimName: {{ $d.data }}}}
        - {name: authority, secret: {secretName: {{ $d.secret }}}}
        - {name: acf, configMap: {name: lab-acf}}
{{ include "lab.scriptsVolume" $ | indent 8 }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $d.deploy }}}
spec:
  type: ClusterIP
  selector: {app: {{ $d.app }}}
  ports:
    - {name: pva-tcp, port: {{ $d.tcp }}, targetPort: {{ $d.tcp }}, protocol: TCP}
    - {name: pva-tls, port: {{ $d.tls }}, targetPort: {{ $d.tls }}, protocol: TCP}
    - {name: pva-udp, port: {{ $d.tls }}, targetPort: {{ $d.tls }}, protocol: UDP}
{{- end }}
