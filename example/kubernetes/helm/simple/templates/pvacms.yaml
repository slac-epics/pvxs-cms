{{/*
The certificate manager. It mints its own authority the first time it starts, which is what
`start-pvacms own` means, and writes it beside its database so a restart finds the same one.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvxs-lab-pvacms
spec:
  replicas: 1
  selector:
    matchLabels: {app: pvacms}
  template:
    metadata:
      labels: {app: pvacms, zone: lab}
    spec:
      securityContext:
        # Root, so that krun_in can become a person by name with 'su -'.
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: pvacms
          image: {{ include "lab.image" (dict "Values" .Values "role" "idm") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/start-pvacms", "own"]
          env:
{{ include "lab.zoneEnv" . | indent 12 }}
            - name: EPICS_PVACMS_DB
              value: /home/idm/.local/share/pva/1.5/certs.db
            - name: EPICS_PVA_TLS_KEYCHAIN
              value: /home/idm/.config/pva/1.5/server.p12
            - name: EPICS_CERT_AUTH_NAME
              value: {{ .Values.certAuthority.name | quote }}
            - name: EPICS_CERT_AUTH_ORGANIZATION
              value: {{ .Values.certAuthority.organization | quote }}
            - name: EPICS_CERT_AUTH_ORGANIZATIONAL_UNIT
              value: {{ .Values.certAuthority.organizationalUnit | quote }}
          ports:
            - {containerPort: {{ .Values.ports.pvaTcp }}, protocol: TCP}
            - {containerPort: {{ .Values.ports.pvaTls }}, protocol: TCP}
            - {containerPort: {{ .Values.ports.pvaUdp }}, protocol: UDP}
          volumeMounts:
            - {name: idm-config, mountPath: /home/idm/.config/pva/1.5}
            - {name: idm-data, mountPath: /home/idm/.local/share/pva/1.5}
            - {name: acf, mountPath: /etc/pvacms/pvacms.acf, subPath: pvacms.acf}
{{ include "lab.scriptsMount" . | indent 12 }}
{{ include "lab.issuerMount" . | indent 12 }}
      volumes:
        - {name: idm-config, persistentVolumeClaim: {claimName: idm-config}}
        - {name: idm-data, persistentVolumeClaim: {claimName: idm-data}}
        - name: acf
          configMap: {name: lab-acf}
{{ include "lab.scriptsVolume" . | indent 8 }}
{{ include "lab.issuerVolume" . | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab.pvacmsService" . }}
spec:
  type: ClusterIP
  selector: {app: pvacms}
  ports:
    - {name: pva-tcp, port: {{ .Values.ports.pvaTcp }}, targetPort: {{ .Values.ports.pvaTcp }}, protocol: TCP}
    - {name: pva-tls, port: {{ .Values.ports.pvaTls }}, targetPort: {{ .Values.ports.pvaTls }}, protocol: TCP}
    - {name: pva-udp, port: {{ .Values.ports.pvaUdp }}, targetPort: {{ .Values.ports.pvaUdp }}, protocol: UDP}
