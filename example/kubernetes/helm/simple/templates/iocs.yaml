{{/*
The two IOCs. Each one is a Deployment behind a Service, which is the arrangement being
tested: a client never addresses the pod, only the Service in front of it.
*/}}
{{- range $ioc := list "testioc" "tstioc" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvxs-lab-{{ $ioc }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $ioc }}}
  template:
    metadata:
      labels: {app: {{ $ioc }}, zone: lab}
    spec:
      securityContext:
        # Root, so that krun_in can become a person by name with 'su -'. The podman
        # laboratory uses 'podman exec --user', which kubectl has no equivalent of.
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: {{ $ioc }}
          image: {{ include "lab.image" (dict "Values" $.Values "role" $ioc) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: ["/usr/local/bin/start-ioc", "{{ $ioc }}"]
          env:
{{ include "lab.zoneEnv" $ | indent 12 }}
          ports:
            - {containerPort: {{ $.Values.ports.pvaTcp }}, protocol: TCP}
            - {containerPort: {{ $.Values.ports.pvaTls }}, protocol: TCP}
            - {containerPort: {{ $.Values.ports.pvaUdp }}, protocol: UDP}
          volumeMounts:
            - {name: config, mountPath: /home/{{ $ioc }}/.config/pva/1.5}
            - {name: acf, mountPath: /home/{{ $ioc }}/{{ $ioc }}.acf, subPath: {{ $ioc }}.acf}
{{ include "lab.scriptsMount" $ | indent 12 }}
{{ include "lab.issuerMount" $ | indent 12 }}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: {{ $ioc }}-config}}
        - name: acf
          configMap: {name: lab-acf}
{{ include "lab.scriptsVolume" $ | indent 8 }}
{{ include "lab.issuerVolume" $ | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pvxs-lab-{{ $ioc }}
spec:
  type: ClusterIP
  selector: {app: {{ $ioc }}}
  ports:
    - {name: pva-tcp, port: {{ $.Values.ports.pvaTcp }}, targetPort: {{ $.Values.ports.pvaTcp }}, protocol: TCP}
    - {name: pva-tls, port: {{ $.Values.ports.pvaTls }}, targetPort: {{ $.Values.ports.pvaTls }}, protocol: TCP}
    - {name: pva-udp, port: {{ $.Values.ports.pvaUdp }}, targetPort: {{ $.Values.ports.pvaUdp }}, protocol: UDP}
{{- end }}
