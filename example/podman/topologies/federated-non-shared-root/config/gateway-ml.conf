{
  "version": 2,
  "readOnly": false,
  "clients": [
    {
      "name": "ml-local",
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-ml pvxs-lab-ml-ioc",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
    }
  ],
  "servers": [
    {
      "name": "gateway",
      "clients": ["ml-local"],
      "acf_client": "ml-local",
      "statusprefix": "GW:STS:",
      "//": "The net-internet address, substituted at start: podman assigns it, and binding",
      "//interface": "every interface would answer ML workstations twice for one name.",
      "interface": ["__SERVE_ADDR__"],
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-ml",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
      "//ports": "The same two ports the lab gateway serves on. Each gateway has an address",
      "//ports2": "of its own on net-internet, so nothing has to be moved aside to fit.",
      "//peer": "Its server side is presented certificates the lab authority issued, and only",
      "//peer2": "that department can say whether they still stand. The peer gateway is named,",
      "//peer3": "never its certificate manager. Read by the inner client alone.",
      "EPICS_PVAS_STATUS_NAME_SERVERS": "pvxs-lab-gateway:5075",
      "serverport": "5075",
      "EPICS_PVAS_TLS_PORT": "5076",
      "bcastport": "5076",
      "access": "gateway.acf",
      "pvlist": "gateway.pvlist"
    },
    {
      "name": "downstream_status",
      "clients": [],
      "interface": ["127.0.0.1"],
      "serverport": "0",
      "statusprefix": "GW:STS:"
    }
  ]
}
