{
  "version": 2,
  "readOnly": false,
  "clients": [
    {
      "name": "local",
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-pvacms pvxs-lab-testioc pvxs-lab-tstioc",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
    }
  ],
  "servers": [
    {
      "name": "gateway",
      "clients": ["local"],
      "acf_client": "local",
      "statusprefix": "GW:STS:",
      "//": "The net-internet address, substituted at start: podman assigns it, and binding",
      "//interface": "every interface would answer lab workstations twice for one name.",
      "interface": ["__SERVE_ADDR__"],
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-pvacms",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
      "//ports": "The default ports. There is no facility address here to map a port to a",
      "//ports2": "department, so each gateway is reached by its own name on the usual two.",
      "//peer": "Its server side is presented certificates the ML authority issued, and only",
      "//peer2": "that department can say whether they still stand. The peer gateway is named,",
      "//peer3": "never its certificate manager. Read by the inner client alone.",
      "EPICS_PVAS_STATUS_NAME_SERVERS": "pvxs-lab-ml-gateway:5075",
      "serverport": "5075",
      "EPICS_PVAS_TLS_PORT": "5076",
      "bcastport": "5076",
      "access": "gateway.acf",
      "pvlist": "gateway.pvlist"
    },
    {
      "name": "downstream_status",
      "clients": [],
      "interface": ["127.0.0.1"],
      "serverport": "0",
      "statusprefix": "GW:STS:"
    }
  ]
}
