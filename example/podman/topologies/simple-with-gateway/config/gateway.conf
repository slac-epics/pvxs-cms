  
{
  "version": 2,
  "readOnly": false,
  "clients": [
    {
      "name": "local",
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-pvacms pvxs-lab-testioc pvxs-lab-tstioc",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12"
    }
  ],
  "servers": [
    {
      "name": "gateway",
      "clients": ["local"],
      "acf_client": "local",
      "statusprefix": "GW:STS:",
      "//": "The DMZ address, substituted at start: podman assigns it, and binding every",
      "//interface": "would answer laboratory workstations twice for the same name.",
      "interface": ["__SERVE_ADDR__"],
      "autoaddrlist": false,
      "addrlist": "pvxs-lab-pvacms",
      "tls_keychain": "/home/gateway/.config/pva/1.5/gateway.p12",
      "//tls-only": "NO closes the plaintext listener, so the boundary carries TLS and nothing",
      "//tls-only2": "else. The gateway must already hold a certificate when it starts with this",
      "//tls-only3": "set, because a gateway with no certificate serves no TLS and so serves",
      "//tls-only4": "nothing at all. Set through the pass-through rather than 'serverport'",
      "//tls-only5": "because pvagw builds its server with useenv=False and ignores the",
      "//tls-only6": "environment, and any key starting EPICS_PVA is handed to the library.",
      "EPICS_PVAS_SERVER_PORT": "NO",
      "EPICS_PVAS_TLS_PORT": "5076",
      "bcastport": "5076",
      "access": "gateway.acf",
      "pvlist": "gateway.pvlist"
    },
    {
      "name": "downstream_status",
      "clients": [],
      "interface": ["127.0.0.1"],
      "serverport": "0",
      "statusprefix": "GW:STS:"
    }
  ]
}
