# The facility load balancer: layer 4, and nothing above it.
#
# It owns the facility address on the outside segment and maps a port to a gateway in the DMZ.
# Each frontend and its backend use the SAME port number, on purpose. Translating a port would
# break PVAccess: a server names its own port in a search reply, and the client then dials
# that port on the address the reply came from, so a client answered "come back on 5075" would
# arrive at whatever 5075 maps to rather than where it started.
#
# tcp mode throughout. Nothing here understands PVAccess, and nothing needs to: the TLS
# session inside the stream is established end to end with the gateway, which is what lets the
# gateway authorise on the certificate presented rather than on where the bytes came from.

global
    log stdout format raw local0

# Podman gives a container a new address every time it starts, and HAProxy resolves a server
# name once at startup and keeps the answer for ever unless told otherwise. Without this, the
# first restart of the gateway leaves the load balancer dialling an address nobody is on, and
# every connection ends in 'CC' with no backend connection made at all.
resolvers podman
    parse-resolv-conf
    resolve_retries     3
    timeout resolve     1s
    timeout retry       1s
    hold valid          5s
    hold other          5s
    hold refused        5s
    hold nx             5s
    hold timeout        5s

defaults
    mode                tcp
    log                 global
    option              tcplog
    timeout connect     5s
    # A monitor is a connection that stays open and says nothing for long stretches, so these
    # are hours rather than the usual seconds. A short timeout here would drop subscriptions
    # that are working perfectly.
    timeout client      24h
    timeout server      24h

frontend pva_plain
    bind :5075
    default_backend gateway_plain

backend gateway_plain
    server lab-gateway pvxs-lab-gateway:5075 resolvers podman resolve-prefer ipv4 init-addr libc,none

frontend pva_tls
    bind :5076
    default_backend gateway_tls

backend gateway_tls
    server lab-gateway pvxs-lab-gateway:5076 resolvers podman resolve-prefer ipv4 init-addr libc,none
