# The simple laboratory, published at a facility address.
#
# Three segments. The laboratory is on net-lab, as in the simple topology. A gateway stands in
# the DMZ with one foot in each, proxying PVAccess inward. A load balancer owns the facility
# address on net-internet and maps a port to the gateway, so the gateway is never published
# directly and the workstation outside knows one address.
#
# Nothing inside the laboratory originates traffic outward - there is no second department to
# reach and no service on another segment - so there is no router here. Every crossing is
# inbound, and the gateway is the only thing that crosses.
#
# Picture: topology/topology-simple-with-gateway.svg

x-lab-env: &lab-env
  EPICS_PVA_AUTO_ADDR_LIST: "YES"

# Every segment carries isolate=true: no podman network forwards to another, so nothing
# reaches another segment by addressing it. What crosses does so through a container standing
# on both sides, and each of those is drawn in this laboratory's picture.
#
# So the gateway is the only way in, in fact and not merely by configuration.
networks:
  net-lab:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.0.0/24
  net-perimeter:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.2.0/24
  net-internet:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.4.0/24

volumes:
  idm-config:
  idm-data:
  testioc-config:
  tstioc-config:
  lab-client-config:
  gateway-config:
  internet-client-config:

services:

  # ---------------------------------------------------------------- the laboratory
  pvxs-lab-pvacms:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/idm:latest
    hostname: pvxs-lab-pvacms
    networks: [net-lab]
    environment:
      <<: *lab-env
      EPICS_PVACMS_DB: /home/idm/.local/share/pva/1.5/certs.db
      EPICS_PVA_TLS_KEYCHAIN: /home/idm/.config/pva/1.5/server.p12
      EPICS_CERT_AUTH_NAME: EPICS Root Certificate Authority
      EPICS_CERT_AUTH_ORGANIZATION: certs.epics.org
      EPICS_CERT_AUTH_ORGANIZATIONAL_UNIT: epics.org Certificate Authority
    volumes:
      - idm-config:/home/idm/.config/pva/1.5
      - idm-data:/home/idm/.local/share/pva/1.5
      - ./config/pvacms.acf:/etc/pvacms/pvacms.acf:ro,z
      - ../../scripts/start-pvacms.sh:/usr/local/bin/start-pvacms:ro,z
    command: ["/usr/local/bin/start-pvacms", "own"]

  pvxs-lab-testioc:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/testioc:latest
    hostname: pvxs-lab-testioc
    networks: [net-lab]
    environment:
      <<: *lab-env
    volumes:
      - testioc-config:/home/testioc/.config/pva/1.5
      - ./config/testioc.acf:/home/testioc/testioc.acf:ro,z
      - ../../scripts/start-ioc.sh:/usr/local/bin/start-ioc:ro,z
    command: ["/usr/local/bin/start-ioc", "testioc"]
    depends_on: [pvxs-lab-pvacms]

  pvxs-lab-tstioc:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/tstioc:latest
    hostname: pvxs-lab-tstioc
    networks: [net-lab]
    environment:
      <<: *lab-env
    volumes:
      - tstioc-config:/home/tstioc/.config/pva/1.5
      - ./config/tstioc.acf:/home/tstioc/tstioc.acf:ro,z
      - ../../scripts/start-ioc.sh:/usr/local/bin/start-ioc:ro,z
    command: ["/usr/local/bin/start-ioc", "tstioc"]
    depends_on: [pvxs-lab-pvacms]

  lab-client:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/lab:latest
    hostname: lab-client
    networks: [net-lab]
    environment:
      <<: *lab-env
      PATH: "/opt/epics/pvxs/bin/linux-x86_64:/opt/epics/pvxs-cms/bin/linux-x86_64:/opt/epics/pvxs/bin/linux-aarch64:/opt/epics/pvxs-cms/bin/linux-aarch64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - lab-client-config:/home/guest/.config/pva/1.5
      - ../../scripts/start-shell.sh:/usr/local/bin/start-shell:ro,z
    command: ["/usr/local/bin/start-shell", "guest", "operator"]

  # ---------------------------------------------------------------- the DMZ
  # One foot in the laboratory, one in the DMZ. It is asked on its DMZ interface and reaches
  # the IOCs and PVACMS on the other.
  pvxs-lab-gateway:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/gateway:latest
    hostname: pvxs-lab-gateway
    networks: [net-lab, net-perimeter]
    environment:
      <<: *lab-env
      # Which segment it serves on. Binding every interface would answer laboratory
      # workstations twice for the same name, once from the IOC and once from here.
      GATEWAY_SERVE_SUBNET: "10.89.2."
    volumes:
      - gateway-config:/home/gateway/.config/pva/1.5
      - ./config/gateway.conf:/home/gateway/gateway.conf.in:ro,z
      - ./config/gateway.pvlist:/home/gateway/gateway.pvlist.in:ro,z
      - ../../scripts/start-gateway.sh:/usr/local/bin/start-gateway:ro,z
    # 'none' because this laboratory's certificate process variables carry no issuer in their
    # names, and its issuer id does not exist until PVACMS has started.
    command: ["/usr/local/bin/start-gateway", "none"]
    depends_on: [pvxs-lab-pvacms]

  # The facility address, and the only way in. HAProxy in tcp mode: it forwards a stream and
  # understands nothing about what is inside it, which is what layer 4 means.
  pvxs-facility-lb:
    init: true
    image: docker.io/library/haproxy:lts-alpine
    hostname: pvxs-facility-lb
    networks:
      net-internet:
        aliases: [facility]
      net-perimeter:
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    depends_on: [pvxs-lab-gateway]

  # ---------------------------------------------------------------- outside
  # It knows one address for the whole facility and nothing about what is behind it.
  internet-client:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/internet:latest
    hostname: internet-client
    networks: [net-internet]
    environment:
      <<: *lab-env
      EPICS_PVA_AUTO_ADDR_LIST: "NO"
      EPICS_PVA_NAME_SERVERS: "facility:5075"
      PATH: "/opt/epics/pvxs/bin/linux-x86_64:/opt/epics/pvxs-cms/bin/linux-x86_64:/opt/epics/pvxs/bin/linux-aarch64:/opt/epics/pvxs-cms/bin/linux-aarch64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - internet-client-config:/home/guest/.config/pva/1.5
      - ../../scripts/start-shell.sh:/usr/local/bin/start-shell:ro,z
    command: ["/usr/local/bin/start-shell", "guest", "operator"]
    depends_on: [pvxs-facility-lb]
