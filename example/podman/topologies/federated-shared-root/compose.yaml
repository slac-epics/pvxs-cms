# Secure PVAccess demonstration laboratory, for podman-compose.
#
# Three networks stand in for three sites. A container reaches only the networks it is
# attached to, so the isolation is enforced by podman rather than by a policy engine:
#
#   net-lab        the accelerator side: its certificate manager, its controllers, its gateway
#   net-ml         the second department: its own certificate manager, controller and gateway
#   net-perimeter  outside both: reaches the two gateways and nothing else
#
# Each gateway sits on its own department's network and on the perimeter, which is the only
# path between them. Nothing on the perimeter can address a certificate manager directly.
#
# Two departments, two intermediate certificate authorities, one facility root that every
# node trusts. A certificate issued by either department is trusted everywhere; who may
# administer which department is decided separately, by each certificate manager's own
# access security file.
#
# Service names match the DNS names used inside the images, so the shell profiles and the
# gateway configuration work unchanged.
#
# Run ./bootstrap.sh first: it builds the images and mints the authorities.

# Carried by the things that never look for a process variable: a certificate manager serves
# and is served, and a gateway is told its upstream in its own configuration file. Everything
# else here leaves discovery on, finds its own department by broadcast, and names the facility
# address for the other one.
x-lab-env: &lab-env
  EPICS_PVA_AUTO_ADDR_LIST: "NO"

# The three segments are pinned, so what a diagram or a note says about them stays true.
# Left to itself podman allocates them from its own pool in whatever order the networks
# happen to be made, and reset.sh makes them again every time. Host addresses within a
# segment are still assigned by podman when a container starts: per-container addresses
# cannot be set here, because podman-compose passes them as --ip, which podman refuses on a
# container attached to more than one network.
# Every segment carries isolate=true, and that is what makes it a segment rather than a
# label. Podman drops traffic between two of its own networks, so nothing on one reaches a
# host on another by addressing it; what crosses does so through a container standing on
# both sides, and each of those is drawn in this laboratory's picture.
#
# Without it the host, which forwards between the bridges and permits everything, carries
# any packet from any segment to any other, and every boundary below becomes a matter of
# policy rather than of the network.
#
# This is the separation a routing firewall would be installed to enforce, and it is why
# this laboratory needs no such appliance. topology-federated-shared-root-routed.svg draws
# the firewall a site would build, and its SIMULATED BY note says which parts of this file
# stand in for it.
networks:
  net-lab:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.0.0/24
  net-ml:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.1.0/24
  net-perimeter:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.2.0/24
  net-it:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.3.0/24
  net-internet:
    driver_opts:
      isolate: "true"
    ipam:
      driver: default
      config:
        - subnet: 10.89.4.0/24

volumes:
  idm-config:
  idm-data:
  ml-config:
  ml-data:
  gateway-config:
  ml-gateway-config:
  testioc-config:
  tstioc-config:
  ml-ioc-config:
  lab-client-config:
  ml-client-config:
  perimeter-client-config:

services:

  # ------------------------------------------------------------- the facility authority
  # Answers for the facility root, at the address named in the root's own extension. What it
  # says is in ./ocsp/index.txt, read when it starts.
  #
  # net-it is its own segment; the other two are legs into the networks that name it, the same
  # accommodation pvxs-facility-lb needs. The certificate managers stay on one interface each
  # so that neither can address the other's.
  pvxs-lab-authority-status:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/idm:latest
    hostname: pvxs-lab-authority-status
    networks: [net-it, net-lab, net-ml]
    volumes:
      - ./ocsp:/ocsp:ro,Z
      - ../../../kubernetes/docker/idm/ocsp-supervisor.conf:/etc/supervisor/conf.d/ocsp.conf:ro,z
      - ../../../kubernetes/docker/idm/ocsp-only-supervisord.conf:/etc/supervisor/supervisord.conf:ro,z
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]

  # ---------------------------------------------------------------- lab department
  pvxs-lab-pvacms:
    init: true
    depends_on: [pvxs-lab-authority-status]
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/idm:latest
    hostname: pvxs-lab-pvacms
    networks: [net-lab]
    env_file: [./issuer_ids.env]
    environment:
      <<: *lab-env
      EPICS_PVACMS_DB: /home/idm/.local/share/pva/1.5/certs.db
      EPICS_PVA_TLS_KEYCHAIN: /home/idm/.config/pva/1.5/server.p12
    volumes:
      - idm-config:/home/idm/.config/pva/1.5
      - idm-data:/home/idm/.local/share/pva/1.5
      # Only this department's own authority, and only this container mounts it, so it
      # can carry a label private to it rather than one every container on the host
      # can read. The facility root's own key is never mounted into a running service.
      - ./certs/lab_intermediate.p12:/certs/lab_intermediate.p12:ro,Z
      - ./config/pvacms-lab.acf:/etc/pvacms/pvacms.acf:ro,z
      - ../../scripts/start-pvacms.sh:/usr/local/bin/start-pvacms:ro,z
    command: ["/usr/local/bin/start-pvacms", "lab"]

  pvxs-lab-testioc:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/testioc:latest
    hostname: pvxs-lab-testioc
    networks: [net-lab]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_AUTH_ISSUER: "${LAB_ISSUER_SKID}"
    volumes:
      - testioc-config:/home/testioc/.config/pva/1.5
      - ../../scripts/start-ioc.sh:/usr/local/bin/start-ioc:ro,z
    command: ["/usr/local/bin/start-ioc", "testioc"]
    depends_on: [pvxs-lab-pvacms]

  pvxs-lab-tstioc:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/tstioc:latest
    hostname: pvxs-lab-tstioc
    networks: [net-lab]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_AUTH_ISSUER: "${LAB_ISSUER_SKID}"
    volumes:
      - tstioc-config:/home/tstioc/.config/pva/1.5
      - ../../scripts/start-ioc.sh:/usr/local/bin/start-ioc:ro,z
    command: ["/usr/local/bin/start-ioc", "tstioc"]
    depends_on: [pvxs-lab-pvacms]

  # The only route between the lab department and the perimeter.
  pvxs-lab-gateway:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/gateway:latest
    hostname: pvxs-lab-gateway
    networks: [net-lab, net-perimeter]
    env_file: [./issuer_ids.env]
    environment:
      <<: *lab-env
      EPICS_PVA_ADDR_LIST: "pvxs-lab-pvacms pvxs-lab-testioc pvxs-lab-tstioc"
      EPICS_PVA_AUTH_ISSUER: "${LAB_ISSUER_SKID}"
      GATEWAY_SERVE_SUBNET: "10.89.2."
    volumes:
      - gateway-config:/home/gateway/.config/pva/1.5
      - ./config/gateway-lab.conf:/home/gateway/gateway.conf.in:ro,z
      - ./config/gateway-lab.pvlist:/home/gateway/gateway.pvlist.in:ro,z
      - ../../scripts/start-gateway.sh:/usr/local/bin/start-gateway:ro,z
    command: ["/usr/local/bin/start-gateway", "LAB_ISSUER"]
    depends_on: [pvxs-lab-pvacms]

  # ------------------------------------------------- machine learning department
  pvxs-lab-ml:
    init: true
    depends_on: [pvxs-lab-authority-status]
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/ml:latest
    hostname: pvxs-lab-ml
    networks: [net-ml]
    env_file: [./issuer_ids.env]
    environment:
      <<: *lab-env
      EPICS_PVACMS_DB: /home/idm/.local/share/pva/1.5/certs.db
      EPICS_PVA_TLS_KEYCHAIN: /home/idm/.config/pva/1.5/server.p12
    volumes:
      - ml-config:/home/idm/.config/pva/1.5
      - ml-data:/home/idm/.local/share/pva/1.5
      - ./certs/ml_intermediate.p12:/certs/ml_intermediate.p12:ro,Z
      - ./config/pvacms-ml.acf:/etc/pvacms/pvacms.acf:ro,z
      - ../../scripts/start-pvacms.sh:/usr/local/bin/start-pvacms:ro,z
    command: ["/usr/local/bin/start-pvacms", "ml"]

  pvxs-lab-ml-ioc:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/ml-ioc:latest
    hostname: pvxs-lab-ml-ioc
    networks: [net-ml]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_AUTH_ISSUER: "${ML_ISSUER_SKID}"
    volumes:
      - ml-ioc-config:/home/mlioc/.config/pva/1.5
      - ../../scripts/start-ioc.sh:/usr/local/bin/start-ioc:ro,z
    command: ["/usr/local/bin/start-ioc", "mlioc"]
    depends_on: [pvxs-lab-ml]

  pvxs-lab-ml-gateway:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/gateway:latest
    hostname: pvxs-lab-ml-gateway
    networks: [net-ml, net-perimeter]
    env_file: [./issuer_ids.env]
    environment:
      <<: *lab-env
      EPICS_PVA_ADDR_LIST: "pvxs-lab-ml pvxs-lab-ml-ioc"
      EPICS_PVA_AUTH_ISSUER: "${ML_ISSUER_SKID}"
      GATEWAY_SERVE_SUBNET: "10.89.2."
    volumes:
      - ml-gateway-config:/home/gateway/.config/pva/1.5
      - ./config/gateway-ml.conf:/home/gateway/gateway.conf.in:ro,z
      - ./config/gateway-ml.pvlist:/home/gateway/gateway.pvlist.in:ro,z
      - ../../scripts/start-gateway.sh:/usr/local/bin/start-gateway:ro,z
    command: ["/usr/local/bin/start-gateway", "ML_ISSUER"]
    depends_on: [pvxs-lab-ml]

  # ------------------------------------------------------------------- clients
  # A shell inside the lab department. Reaches its own certificate manager directly.
  lab-client:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/lab:latest
    hostname: lab-client
    # One interface, as a workstation has. What carries it to the facility address is the
    # host, which routes between podman's segments: see the note in the README.
    networks: [net-lab]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_NAME_SERVERS: "facility:5175"
      EPICS_PVA_AUTH_ISSUER: "${LAB_ISSUER_SKID}"
      PATH: "/opt/epics/pvxs/bin/linux-x86_64:/opt/epics/pvxs-cms/bin/linux-x86_64:/opt/epics/pvxs/bin/linux-aarch64:/opt/epics/pvxs-cms/bin/linux-aarch64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - lab-client-config:/home/guest/.config/pva/1.5
      - ../../scripts/start-shell.sh:/usr/local/bin/start-shell:ro,z
    command: ["/usr/local/bin/start-shell", "guest", "operator"]

  # A shell inside the machine learning department, the mirror of lab-client: its own
  # department directly, and the perimeter so it can reach the other department's gateway.
  ml-client:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/lab:latest
    hostname: ml-client
    networks: [net-ml]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_NAME_SERVERS: "facility:5075"
      EPICS_PVA_AUTH_ISSUER: "${ML_ISSUER_SKID}"
      PATH: "/opt/epics/pvxs/bin/linux-x86_64:/opt/epics/pvxs-cms/bin/linux-x86_64:/opt/epics/pvxs/bin/linux-aarch64:/opt/epics/pvxs-cms/bin/linux-aarch64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ml-client-config:/home/guest/.config/pva/1.5
      - ../../scripts/start-shell.sh:/usr/local/bin/start-shell:ro,z
    command: ["/usr/local/bin/start-shell", "guest", "operator"]

  # A shell outside both departments. Reaches the two gateways and nothing else, so
  # every certificate status lookup and every process variable crosses a gateway.
  perimeter-client:
    init: true
    image: ${DOCKER_REGISTRY:-localhost}/${DOCKER_USERNAME:-spva}/internet:latest
    hostname: perimeter-client
    networks: [net-internet]
    env_file: [./issuer_ids.env]
    environment:
      EPICS_PVA_AUTO_ADDR_LIST: "YES"
      EPICS_PVA_NAME_SERVERS: "facility:5075 facility:5175"
      PATH: "/opt/epics/pvxs/bin/linux-x86_64:/opt/epics/pvxs-cms/bin/linux-x86_64:/opt/epics/pvxs/bin/linux-aarch64:/opt/epics/pvxs-cms/bin/linux-aarch64:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - perimeter-client-config:/home/guest/.config/pva/1.5
      - ../../scripts/start-shell.sh:/usr/local/bin/start-shell:ro,z
    command: ["/usr/local/bin/start-shell", "guest", "operator"]

  # ------------------------------------------------------------------- the facility address
  # One address published for the whole facility; the port chooses the department. HAProxy in
  # tcp mode: it forwards a stream and understands nothing about what is inside it.
  #
  # A leg on every segment that names it, and the alias repeated on each. Podman answers a
  # name only for containers that share a segment with the asker, and each department's
  # workstation reaches the other department by that name - the same accommodation the
  # certificate managers need to reach the responder. At a real site one address in DNS and a
  # route would do it; here the name has to be answerable where it is asked.
  pvxs-facility-lb:
    init: true
    image: docker.io/library/haproxy:lts-alpine
    hostname: pvxs-facility-lb
    networks:
      net-internet:
        aliases: [facility]
      net-lab:
        aliases: [facility]
      net-ml:
        aliases: [facility]
      net-perimeter:
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    depends_on: [pvxs-lab-gateway, pvxs-lab-ml-gateway]
